<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixel Farm - Cho</title>
<style>
html,body{margin:0;height:100%;background:#14101a;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;touch-action:none;user-select:none;-webkit-user-select:none}
@media (orientation:portrait){canvas{display:none}body::before{content:'XOAY NGANG DIEN THOAI';color:#ffe060;font:bold 20px monospace}}
</style></head>
<body><canvas id="g"></canvas>
<script src="core.js"></script>
<script>
/* MAP 2: CHO / QUAN AN 24x22 - khach hien bong goi mon, cham vao khach de ban */
const C = Core, G = C.G, T = 16, N = C.NAMES, box = C.box;
const tiles = C.grid(24, 22, 2, [
  [1, 0, 0, 24, 1], [1, 0, 21, 24, 1], [1, 0, 0, 1, 22], [1, 23, 0, 1, 22],
  [3, 10, 1, 4, 21], [3, 1, 10, 22, 2], [3, 11, 21, 2, 1]
]);
const SEATS = [[4, 6], [19, 6], [4, 15], [19, 15], [8, 8], [15, 8]];
const LOOK = [['#2b2233', '#e84848', 'cap'], ['#7a4a28', '#58c040', 'chef'], ['#ffd860', '#4aa0e8', null], ['#7a4a28', '#e8a030', 'straw'], ['#8a5a9a', '#ffd860', 'cap'], ['#2b2233', '#40b060', null]];

function customer(i) {
  const [tx, ty] = SEATS[i], x = tx * T + 8, y = ty * T + 12, st = { want: null, back: Date.now() + i * 3000 };
  const order = () => { st.want = C.RECIPES[(Math.random() * C.RECIPES.length) | 0]; };
  return {
    x: x - 5, y: y - 6, w: 10, h: 6, hh: 36, solid: false,
    draw(c, n) {
      if (!st.want && n > st.back) order();
      if (!st.want) return;
      C.chibi(c, x, y + (Math.sin(n / 400 + i) > .7 ? -1 : 0), 0, 0, ...LOOK[i]);
      const t = N[st.want.id], bw = C.tw(t) + 6;
      box(c, x - (bw >> 1), y - 38, bw, 9, '#f1ead8', '#ffffff', '#b8b3a3'); C.text(c, t, x - (bw >> 1) + 3, y - 36, '#3b2a1c');
    },
    menu() {
      const r = st.want; if (!r) return null;
      return { title: 'KHACH MUON ' + N[r.id], items: [{ label: 'BAN +' + r.price + 'G (CO ' + G.inv[r.id] + ')', off: G.inv[r.id] < 1, fn() { G.inv[r.id]--; G.money += r.price; C.stat('sold'); C.toast('BAN ' + N[r.id] + ' +' + r.price); st.want = null; st.back = Date.now() + 8000 + Math.random() * 12000; } }] };
    }
  };
}
const table = (tx, ty) => ({ x: tx * T, y: ty * T, w: T, h: T, solid: true, draw(c) { box(c, this.x + 1, this.y + 3, 14, 11, '#8f6a45', '#b58a5c', '#5e4430'); box(c, this.x + 5, this.y + 5, 6, 3, '#e8e4d8', '#ffffff', '#b8b3a3'); } });

const map = {
  cols: 24, rows: 22, tiles, name: 'CHO', spawn: { x: 12 * T, y: 18 * T },
  exits: [{ x: 11 * T, y: 21 * T + 4, w: 2 * T, h: 12, to: 'index.html', spawn: { x: 15.5 * T, y: 24 * T } }],
  objs() {
    const o = SEATS.map((s, i) => customer(i));
    SEATS.forEach(([a, b]) => o.push(table(a, b + 1)));
    // bang quan an tren tuong
    o.push({ x: 8 * T, y: 3, w: 8 * T, h: 12, z: -1, draw(c) { box(c, this.x, 2, this.w, 12, '#a98660', '#c9a678', '#6e4f33'); C.text(c, 'QUAN AN PIXEL', this.x + 36, 6, '#3b2a1c'); } });
    [[2, 2], [21, 2], [2, 19], [21, 19]].forEach(([a, b]) => o.push(C.tree(a, b)));
    return o;
  }
};
Core.start(map);
</script></body></html>
