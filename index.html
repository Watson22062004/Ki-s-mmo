<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixel Farm - Nong trai</title>
<style>
html,body{margin:0;height:100%;background:#14101a;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;touch-action:none;user-select:none;-webkit-user-select:none}
</style></head>
<body><canvas id="g"></canvas>
<script src="core.js"></script>
<script>
/* MAP 1: NONG TRAI (tile: 0 co, 1 gach, 2 san go, 3 duong da, 4 dat cay) */
const C = Core, G = C.G, T = 16, box = C.box;
const DUR = { carrot: 20000, rice: 30000 };   // thoi gian lon (ms)
const PEN = { chicken: 25000, pig: 45000 };   // thoi gian ra san pham (ms)

const tiles = [
  '1111111111',
  '0000000000',
  '0444002220',
  '0444002220',
  '0000000000',
  '0111111110',
  '0122222210',
  '0122222210',
  '0111331110',
  '0000330000',
  '0000330000',
  '0000330000'
];

function plot(i) {
  const x = (1 + i % 3) * T, y = (2 + (i / 3 | 0)) * T, p = G.plots[i];
  return {
    x, y, w: T, h: T, z: -1,
    draw(c, now) {
      if (!p.s) return;
      const g = (now - p.t) / DUR[p.s];
      if (g < .33) { c.fillStyle = '#4a3322'; c.fillRect(x + 6, y + 9, 4, 2); }
      else if (g < 1) { c.fillStyle = '#4f8a3c'; c.fillRect(x + 7, y + 6, 2, 5); c.fillStyle = '#7fb05a'; c.fillRect(x + 5, y + 6, 2, 2); c.fillRect(x + 9, y + 6, 2, 2); }
      else if (p.s === 'carrot') { c.fillStyle = '#4f8a3c'; c.fillRect(x + 5, y + 3, 6, 3); c.fillStyle = '#7fb05a'; c.fillRect(x + 6, y + 2, 2, 2); box(c, x + 5, y + 6, 6, 7, '#d9843b', '#f0a65a', '#a85f28'); }
      else { for (const a of [3, 7, 11]) { c.fillStyle = '#8f8a3a'; c.fillRect(x + a, y + 5, 1, 8); box(c, x + a - 1, y + 2, 3, 5, '#d8c46a', '#f0e090', '#a8933e'); } }
    },
    act(now) {
      if (!p.s) { p.s = G.seed; p.t = now; C.toast('TRONG ' + C.NAMES[p.s]); }
      else if ((now - p.t) / DUR[p.s] >= 1) { G.inv[p.s]++; C.toast('THU ' + C.NAMES[p.s] + ' +1'); p.s = null; C.save(); }
      else C.toast('CHUA CHIN');
    }
  };
}
function animal(kind, x, y) {
  const per = PEN[kind], item = kind === 'chicken' ? 'egg' : 'pork';
  return {
    x, y, w: T, h: T, solid: true,
    draw(c, now) {
      const rdy = now - G.pen[kind] > per, b = rdy && Math.sin(now / 150) > 0 ? 1 : 0;
      if (kind === 'chicken') {
        box(c, x + 3, y + 5, 10, 9, '#e8e4d8', '#ffffff', '#b8b3a3');
        c.fillStyle = '#c0453a'; c.fillRect(x + 7, y + 3, 2, 2);
        c.fillStyle = '#d98a3b'; c.fillRect(x + 6, y + 9, 4, 1);
        c.fillStyle = '#1b1420'; c.fillRect(x + 5, y + 7, 1, 1); c.fillRect(x + 10, y + 7, 1, 1);
      } else {
        box(c, x + 1, y + 4, 14, 11, '#d99aa0', '#f0b8bc', '#b57a82');
        c.fillStyle = '#b57a82'; c.fillRect(x + 2, y + 3, 3, 2); c.fillRect(x + 11, y + 3, 3, 2);
        box(c, x + 5, y + 9, 6, 4, '#c2828a', '#d99aa0', '#9a636a');
        c.fillStyle = '#1b1420'; c.fillRect(x + 4, y + 7, 1, 1); c.fillRect(x + 11, y + 7, 1, 1);
      }
      if (rdy) box(c, x + 6, y - 3 - b, 4, 4, item === 'egg' ? '#f1ead8' : '#c9585a', '#ffffff', '#8a3a3c');
    },
    act(now) {
      if (now - G.pen[kind] > per) { G.inv[item]++; G.pen[kind] = now; C.toast('+1 ' + C.NAMES[item]); C.save(); }
      else C.toast('DANG LON...');
    }
  };
}
const map = {
  tiles, spawn: { x: 80, y: 172 },
  exits: [{ x: 64, y: 186, w: 32, h: 6, to: 'map2.html', spawn: { x: 80, y: 166 } }],
  hud: () => 'HAT:' + C.NAMES[G.seed],
  sLabel: 'HAT',
  onS() { G.seed = G.seed === 'carrot' ? 'rice' : 'carrot'; C.toast('HAT ' + C.NAMES[G.seed]); },
  objs() {
    const o = [0, 1, 2, 3, 4, 5].map(plot);
    o.push(animal('chicken', 6 * T, 2 * T), animal('pig', 8 * T, 3 * T));
    // bep nau trong nha
    o.push({
      x: 3 * T, y: 6 * T, w: T, h: T, solid: true,
      draw(c, now) {
        box(c, this.x, this.y, T, T, '#6d6a75', '#8c8996', '#4a4752');
        c.fillStyle = '#2b2733'; c.fillRect(this.x + 3, this.y + 4, 4, 4); c.fillRect(this.x + 9, this.y + 4, 4, 4);
        c.fillStyle = Math.sin(now / 120) > 0 ? '#e8a23b' : '#d9743b'; c.fillRect(this.x + 4, this.y + 5, 2, 2); c.fillRect(this.x + 10, this.y + 5, 2, 2);
      },
      act() { C.cook(); }
    });
    o.push({ x: 6 * T, y: 6 * T, w: T, h: T, solid: true, draw(c) { box(c, this.x + 1, this.y + 3, 14, 11, '#8f6a45', '#b58a5c', '#5e4430'); } });
    // bang chi duong sang quan
    o.push({ x: 70, y: 150, w: 20, h: 9, z: -1, draw(c) { box(c, 70, 150, 20, 9, '#a98660', '#c9a678', '#6e4f33'); C.text(c, 'QUAN', 72, 152, '#3b2a1c'); } });
    return o;
  }
};
Core.start(map);
</script></body></html>
