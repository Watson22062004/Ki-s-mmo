const mapRand=(seed)=>{let a=seed>>>0;return()=>{a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),a|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}};

function spr(k,s=4){let a=SPRITES[k]||[],c=document.createElement("canvas");c.width=(a[0]||"").length*s;c.height=a.length*s;let g=c.getContext("2d");a.forEach((r,y)=>[...r].forEach((ch,x)=>{if(PALETTE[ch]){g.fillStyle=PALETTE[ch];g.fillRect(x*s,y*s,s,s)}}));return c}

function auth(){root.innerHTML=`<div class="frame auth"><div class="auth-hero"><div class="auth-sprites"><img src="${url("warrior",6)}"><img src="${url("archer",6)}"><img src="${url("mage",6)}"></div><h1 class="title">Kỵ Sĩ Pixel</h1><p class="subtitle">Đăng nhập để cùng các nhà thám hiểm khác săn quái, nhặt đồ và lên cấp.</p></div><form class="panel auth-form" onsubmit="event.preventDefault();chars()"><div class="tabs"><button type="button" class="tab on">Đăng nhập</button><button type="button" class="tab">Đăng ký</button></div><input placeholder="Tên đăng nhập" value="tester"><input type="password" placeholder="Mật khẩu" value="123456"><button class="btn primary">Vào game</button></form></div>`}
function chars(){root.innerHTML=`<div class="frame chars"><div class="chars-head"><h2>Nhân vật của tester</h2><button class="btn small" onclick="auth()">Đăng xuất</button></div><div class="chars-body"><div><div class="class-pick">${["warrior","archer","mage"].map(x=>`<button class="class-opt ${st.cls==x?"on":""}" onclick="pick('${x}')"><img src="${url(x,6)}"><b>${C[x].name}</b><span>${C[x].desc}</span></button>`).join("")}</div><div style="display:flex;gap:1em;margin-top:2em"><input id="nm" value="Kỵ Sĩ" maxlength="14"><button class="btn primary" onclick="start()">Vào game</button></div></div></div></div>`}

}
function drawSprite(k,x,y,s=3,frame=0,flip=false,alpha=1,angle=0){let rows=SPRITES[k]||[];let a=rows.map(r=>r.split(""));
  // 3 trạng thái animation nhẹ: idle, walk, attack/hit; vẫn giữ pixel-art gốc.
  if(frame===1 && a.length){a=a.map((r,i)=>{let z=[...r];if(i>=10&&i<15){if((i+frame)%2===0){let q=z[4];z[4]='.';z[5]=q}}return z});}
  if(frame===2 && a.length){a=a.map((r,i)=>{let z=[...r];if(i===7||i===8){for(let j=0;j<z.length;j++)if(z[j]!=='.'&&j>9){let q=z[j];z[j]='.';if(j+1<z.length)z[j+1]=q;}}return z});}
  let im=sprFromRows(a.map(r=>r.join("")),s);ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(angle);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-im.width/2,-im.height);ctx.restore();}
function sprFromRows(rows,s=4){let c=document.createElement("canvas");c.width=(rows[0]||"").length*s;c.height=rows.length*s;let g=c.getContext("2d");rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(PALETTE[ch]){g.fillStyle=PALETTE[ch];g.fillRect(x*s,y*s,s,s)}}));return c}

function obstacle(o){let[x,y,w,h,k]=o;if(k=="house"){ctx.fillStyle="#0004";ctx.fillRect(x+8,y+h-8,w,14);ctx.fillStyle="#c9a26b";ctx.fillRect(x,y+60,w,h-60);ctx.fillStyle="#a23b3b";ctx.fillRect(x-10,y,w+20,64);ctx.fillStyle="#5a3818";ctx.fillRect(x+w/2-20,y+h-56,40,56);ctx.fillStyle="#9fd8ff";ctx.fillRect(x+24,y+80,34,30);ctx.fillRect(x+w-58,y+80,34,30)}else if(k=="fountain"){ctx.fillStyle="#8d8d9a";ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,62,42,0,0,7);ctx.fill();ctx.fillStyle="#4a9de0";ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,48,30,0,0,7);ctx.fill()}else{ctx.fillStyle="#7d8794";ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7);ctx.fill()}}

  // nền + đường/tile theo layout gốc
  ctx.fillStyle="#315f38";ctx.fillRect(0,0,m.w,m.h);ctx.fillStyle=m.theme==="city"?"#4caf50":"#4a8f3e";ctx.fillRect(0,0,m.w,m.h);
  if(m.theme==="city"){ctx.fillStyle="#9a9aa8";ctx.fillRect(0,340,m.w,120);ctx.fillRect(500,230,280,340);ctx.fillStyle="#74747f";for(let x=0;x<m.w;x+=48)ctx.fillRect(x,398,32,2);for(let y=340;y<460;y+=32)ctx.fillRect(18,y,2,20)}else{ctx.fillStyle="#80623e";ctx.fillRect(0,640,900,130);ctx.fillStyle="#6b5134";for(let x=0;x<900;x+=42)ctx.fillRect(x,705,30,2)}
  let dec=decor[st.map]||[];dec.forEach(([x,y],i)=>{if(m.theme==="city"&&((y>330&&y<470)||(x>490&&x<790&&y>220&&y<580)))return;drawSprite(i%7===0?"flower":"flower",x,y,3,0,false,.9)});
  for(let x=20;x<m.w;x+=56){drawSprite("tree",x,52,4);drawSprite("tree",x,m.h+8,4)}for(let y=108;y<m.h;y+=56){drawSprite("tree",16,y,4);drawSprite("tree",m.w-16,y,4)}
  m.obs.forEach(obstacle);let p=m.p;ctx.fillStyle="#6ec6ff55";ctx.strokeStyle="#d9c1ff";ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(p[0]+p[2]/2,p[1]+p[3]/2,p[2]*.38,p[3]/2,0,0,7);ctx.fill();ctx.stroke();ctx.fillStyle="#e8d9ff";ctx.font="bold 15px Trebuchet MS";ctx.textAlign="center";ctx.fillText(p[5],p[0]+p[2]/2,p[1]-8);
  if(st.map==="field")mon.forEach(q=>{let frame=q.flash>0?2:(q.ai>0?1:0),bob=q.ai>0?Math.abs(Math.sin(animTime*.012+q.x)) * 2:0;drawSprite(q.t,q.x,q.y-bob,3,frame,q.dir<0,q.h<=0?0.25:1);ctx.fillStyle="#000";ctx.fillRect(q.x-21,q.y-54,42,6);ctx.fillStyle="#d83a3a";ctx.fillRect(q.x-20,q.y-53,40*Math.max(0,q.h/q.m),4);ctx.fillStyle="#fff";ctx.font="13px Trebuchet MS";ctx.fillText(q.t==="wolf"?"Sói Lv3":"Goblin Lv6",q.x,q.y-58)});
  let moving=keys.size>0,frame=attackAnim>0?2:(moving?1:0),bob=moving?Math.abs(Math.sin(animTime*.018))*3:0;drawSprite(st.cls,st.x,st.y-bob,3,frame,playerDir<0,st.hp<=0?.35:1,attackAnim>0?(playerDir<0?-0.15:0.15):0);ctx.fillStyle="#9dffa0";ctx.font="bold 13px Trebuchet MS";ctx.fillText(st.name+"  Lv"+st.level,st.x,st.y-55);
  ctx.restore();drawEffects(sx,sy);}
function drawEffects(sx,sy){fxc.clearRect(0,0,1170,540);for(let i=fxs.length-1;i>=0;i--){let e=fxs[i],age=(performance.now()-e.t)/e.d;if(age>=1){fxs.splice(i,1);continue}let x=e.x-sx,y=e.y-sy;fxc.save();fxc.globalAlpha=1-age;if(e.type==="slash"){fxc.strokeStyle="#fff";fxc.lineWidth=6;fxc.beginPath();fxc.arc(x,y-25,34,e.a-.8,e.a+.8);fxc.stroke()}else if(e.type==="proj"){fxc.fillStyle=e.color;fxc.beginPath();fxc.arc(x,y-25,6+4*(1-age),0,7);fxc.fill()}else if(e.type==="hit"){fxc.strokeStyle=e.color;fxc.lineWidth=4;for(let j=0;j<6;j++){let a=j*Math.PI/3;fxc.beginPath();fxc.moveTo(x+Math.cos(a)*8,y-25+Math.sin(a)*8);fxc.lineTo(x+Math.cos(a)*28*(1-age),y-25+Math.sin(a)*28*(1-age));fxc.stroke()}}else if(e.type==="death"){fxc.strokeStyle="#ffd54f";fxc.lineWidth=3;fxc.beginPath();fxc.arc(x,y-28,15+35*age,0,7);fxc.stroke()}fxc.restore()}if(attackAnim>0){attackAnim=Math.max(0,attackAnim-16)}}

function blocked(x,y){let m=M[st.map];for(let o of m.obs)if(x+18>o[0]&&x-18<o[0]+o[2]&&y+18>o[1]&&y-18<o[1]+o[3])return true;return false}
function move(dt){let dx=(keys.has("d")||keys.has("arrowright"))-(keys.has("a")||keys.has("arrowleft")),dy=(keys.has("s")||keys.has("arrowdown"))-(keys.has("w")||keys.has("arrowup"));if(dx||dy){let l=Math.hypot(dx,dy);dx/=l;dy/=l;playerDir=dx<0?-1:dx>0?1:playerDir;let nx=st.x+dx*170*dt,ny=st.y+dy*170*dt;if(!blocked(nx,st.y))st.x=nx;if(!blocked(st.x,ny))st.y=ny}let m=M[st.map];st.x=Math.max(40,Math.min(m.w-40,st.x));st.y=Math.max(64,Math.min(m.h-40,st.y));
  if(st.map==="field")updateMonsters(dt);let p=m.p;if(st.x>p[0]&&st.x<p[0]+p[2]&&st.y>p[1]&&st.y<p[1]+p[3]){st.map=p[4];st.x=M[st.map].spawn[0];st.y=M[st.map].spawn[1];spawn();msg("Đã sang "+M[st.map].name)}}
function updateMonsters(dt){for(const q of mon){if(q.h<=0)continue;q.flash=Math.max(0,q.flash-dt*1000);q.atk=Math.max(0,q.atk-dt*1000);let d=Math.hypot(st.x-q.x,st.y-q.y);let aggro=q.t==="wolf"?250:210;if(d<aggro&&d>48){let dx=(st.x-q.x)/d,dy=(st.y-q.y)/d;q.x+=dx*(q.t==="wolf"?55:42)*dt;q.y+=dy*(q.t==="wolf"?55:42)*dt;q.dir=dx<0?-1:1;q.ai=1}else{q.ai=Math.max(0,q.ai-dt*2)}if(d<58&&q.atk<=0&&st.hp>0){let dmg=q.t==="wolf"?5:8;st.hp=Math.max(0,st.hp-Math.max(1,dmg-stat().def*(st.buff>0?0.7:0.35)));q.atk=q.t==="wolf"?1300:1700;q.flash=180;fxs.push({type:"hit",x:st.x,y:st.y,t:performance.now(),d:250,color:"#ff6b6b"});if(st.hp<=0)msg("Bạn đã bị hạ! Nhấn Đánh để hồi sinh")}}}

function renderSkills(){let a=SK[st.cls]||[];skills.innerHTML=a.map((x,i)=>`<button class="skill" onclick="cast(${i})"><b>${i+1}</b><small>${x.n}</small><br>${Math.ceil(st.skillCd[i]/1000)}s</button>`).join("")}
function cast(i){let x=(SK[st.cls]||[])[i],now=performance.now();if(!x||st.skillCd[i]>0)return;if(st.mp<x.cost)return msg("Không đủ MP");st.mp-=x.cost;st.skillCd[i]=x.cd;if(x.type==="buff"){st.buff=6000;fxs.push({type:"death",x:st.x,y:st.y,t:now,d:700});msg("Thiết Giáp: DEF tăng mạnh");return}let targets=mon.filter(q=>q.h>0&&Math.hypot(q.x-st.x,q.y-st.y)<=x.r).sort((a,b)=>Math.hypot(a.x-st.x,a.y-st.y)-Math.hypot(b.x-st.x,b.y-st.y));if(!targets.length)return msg("Không có mục tiêu");let list=x.type==="aoe"?targets:targets.slice(0,x.type==="multi"?3:1);for(let q of list){let d=Math.max(1,Math.round(stat().atk*x.p-(q.t==="wolf"?1:3)));q.h-=d;q.flash=220;floatText(q.x,q.y-70,d,"#ffd54f");fxs.push({type:x.type==="fire"?"proj":"slash",x:q.x,y:q.y,t:now,d:350,a:Math.atan2(q.y-st.y,q.x-st.x),color:"#ff9d45"});if(q.h<=0)killMonster(q)}}
function killMonster(q){let xp=q.t==="wolf"?14:30;st.exp+=xp;st.questKills+=(st.quest&&st.quest.kill===q.t)?1:0;let drops=DROPS[q.t]||[];if(Math.random()<.65&&st.inv.length<20)st.inv.push(drops[Math.floor(Math.random()*drops.length)]);if(Math.random()<.5){st.gold+=q.t==="wolf"?3:7}fxs.push({type:"death",x:q.x,y:q.y,t:performance.now(),d:500});setTimeout(()=>{let i=mon.indexOf(q);if(i>=0)mon.splice(i,1)},220);msg("Hạ quái! +"+xp+" EXP");while(st.exp>=100){st.exp-=100;st.level++;st.hp=stat().hp;st.mp=C[st.cls].mp;msg("LEVEL UP! "+st.level)}}
function talkNPC(){if(st.map!=="city")return msg("Hãy về thành phố để gặp NPC");npc.innerHTML=`<div class="npcbox"><h3>Trưởng làng</h3><p>Chào nhà thám hiểm. Chọn một nhiệm vụ:</p>${QUESTS.map(q=>`<button class="btn" style="margin:.2em" onclick="takeQuest('${q.id}')">${q.name} — ${q.need} quái · ${q.reward} EXP + ${q.gold} vàng</button>`).join("")}<button class="btn" onclick="closeNPC()">Đóng</button></div>`}
function closeNPC(){npc.innerHTML=""}
function takeQuest(id){let q=QUESTS.find(x=>x.id===id);st.quest=q;st.questKills=0;closeNPC();msg("Nhận nhiệm vụ: "+q.name)}
function questUI(){if(!st.quest){questui.innerHTML="";return}let q=st.quest;if(st.questKills>=q.need){st.exp+=q.reward;st.gold+=q.gold;msg("Hoàn thành "+q.name+"! +"+q.reward+" EXP, +"+q.gold+" vàng");st.quest=null;st.questKills=0;return}questui.innerHTML=`<div class="quest"><b>${q.name}</b><br>Tiến độ: ${Math.min(st.questKills,q.need)}/${q.need}<br>Thưởng: ${q.reward} EXP · ${q.gold} vàng</div>`}
function useItem(i){let id=st.inv[i];if(id==="potion_small"){let max=stat().hp;st.hp=Math.min(max,st.hp+45);st.inv.splice(i,1);msg("Hồi 45 HP")}else if(id==="potion_mana"){st.mp=Math.min(C[st.cls].mp,st.mp+25);st.inv.splice(i,1);msg("Hồi 25 MP")}renderInv()}
function hit(){let c=C[st.cls],s=stat(),now=performance.now();if(st.hp<=0){st.hp=s.hp;st.mp=c.mp;msg("Đã hồi sinh!");return}if(now-st.last<c.cd)return;if(st.mp<c.cost)return msg("Không đủ MP");st.last=now;st.mp=Math.min(c.mp,st.mp-c.cost);let q=mon.filter(q=>q.h>0).sort((a,b)=>Math.hypot(a.x-st.x,a.y-st.y)-Math.hypot(b.x-st.x,b.y-st.y))[0];if(!q||Math.hypot(q.x-st.x,q.y-st.y)>c.range)return msg("Không có mục tiêu trong tầm");let crit=Math.random()<.12,d=Math.max(1,Math.round((s.atk-(q.t==="wolf"?1:3))*(crit?1.8:1)));q.h-=d;q.flash=180;attackAnim=170;let ang=Math.atan2(q.y-st.y,q.x-st.x);fxs.push({type:"slash",x:st.x,y:st.y,t:performance.now(),d:220,a:ang});if(c.weapon==="bow"||c.weapon==="staff")fxs.push({type:"proj",x:q.x,y:q.y,t:performance.now(),d:260,color:c.weapon==="bow"?"#fff":"#d58cff"});fxs.push({type:"hit",x:q.x,y:q.y,t:performance.now(),d:280,color:crit?"#ffd54f":"#fff"});floatText(q.x,q.y-75,(crit?"CRIT ":"")+d,crit?"#ffd54f":"#fff");if(q.h<=0)killMonster(q)}
function floatText(x,y,t,color){let el=document.createElement("div");el.textContent=t;el.style.cssText=`position:fixed;left:${(x-M[st.map].w/2)*.6+50}%;top:42%;color:${color};font:bold 22px Trebuchet MS;text-shadow:2px 2px #000;pointer-events:none;z-index:20;transform:translate(-50%,0)`;document.body.appendChild(el);el.animate([{transform:"translate(-50%,0)",opacity:1},{transform:"translate(-50%,-55px)",opacity:0}],{duration:650,easing:"ease-out"}).onfinish=()=>el.remove()}

function hud(){let s=stat();status.innerHTML=`<img class="avatar" src="${url(st.cls,4)}"><div class="status-bars"><div class="status-name">${st.name} · ${C[st.cls].name} · Lv${st.level}</div><div class="bar hp"><i style="width:${100*st.hp/s.hp}%"></i><span>HP ${Math.round(st.hp)}/${s.hp}</span></div><div class="bar mp"><i style="width:${100*st.mp/s.mp}%"></i><span>MP ${Math.round(st.mp)}/${s.mp}</span></div><div class="bar exp"><i style="width:${st.exp}%"></i><span>EXP ${st.exp}/100</span></div></div>`;mn.textContent=M[st.map].name;toast.innerHTML=st.msg?`<div class="toast">${st.msg}</div>`:"";let g=mini.getContext("2d"),m=M[st.map];mini.width=288;mini.height=128;g.fillStyle=m.theme=="city"?"#4caf50":"#4a8f3e";g.fillRect(0,0,288,128);g.fillStyle="#9a9aa8";if(m.theme=="city"){g.fillRect(0,54,288,20);g.fillRect(112,37,63,54)}else g.fillRect(0,58,108,15);g.fillStyle="#fff";g.fillRect(st.x/m.w*288-2,st.y/m.h*128-2,4,4)}
function inv(){st.open=!st.open;renderInv()}function renderInv(){if(!st.open){inventory.innerHTML="";return}let bag=Array.from({length:20},(_,i)=>{let id=st.inv[i];return `<button class="slot" onclick="inspect(${i})">${id?`<img src="${url(I[id][1],3)}">`:""}</button>`}).join("");inventory.innerHTML=`<div class="inventory"><div class="inv-head">Túi đồ · 💰 ${st.gold} <button class="btn small" onclick="inv()">Đóng</button></div><div class="inv-grid"><div><h3>Trang bị</h3><div class="slots">${Object.values(st.equip).map(id=>`<button class="slot">${id?`<img src="${url(I[id][1],3)}">`:""}</button>`).join("")}</div><p>ATK ${stat().atk} · DEF ${stat().def}</p></div><div><h3>Vật phẩm</h3><div class="slots">${bag}</div></div><div id="detail" class="detail">Chọn vật phẩm để xem.</div></div></div>`}function inspect(i){let id=st.inv[i];if(!id)return;let a=I[id];if(a[1]==="potion"){detail.innerHTML=`<b style="color:#e3b04b">${a[0]}</b><p>Dùng để hồi phục.</p><button class="btn primary" onclick="useItem(${i})">Sử dụng</button>`;return}detail.innerHTML=`<b style="color:#e3b04b">${a[0]}</b><p>ATK +${a[2]} · DEF +${a[3]} · HP +${a[4]*5}</p><button class="btn primary" onclick="equip(${i})">Trang bị</button>`}function equip(i){let id=st.inv[i],a=I[id],slot=a[1]=="armor"?"armor":a[1]=="helmet"?"helmet":"weapon";let old=st.equip[slot];st.equip[slot]=id;st.inv[i]=old;st.inv=st.inv.filter(Boolean);renderInv();msg("Đã trang bị "+a[0])}
function loop(t){st.skillCd=st.skillCd.map(x=>Math.max(0,x-(t-last)));renderSkills();questUI();let dt=Math.min(.05,(t-last)/1000);last=t;animTime=t;move(dt);world();hud();requestAnimationFrame(loop)}setInterval(()=>{try{localStorage.setItem("kysipixel-save",JSON.stringify(st))}catch(e){}},2000);auth();
</script></body></html>
